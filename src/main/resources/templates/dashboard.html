<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('User Profile & Security')}"></head>
<body>
<main class="page-wrapper profile-page-wrapper">
  <div class="profile-container">
    <!-- Top Profile Summary & Avatar Header Fragment -->
    <div th:replace="~{fragments/profile/profile-header :: profile-header}"></div>

    <!-- Global Alert Notifications Fragment -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <!-- Navigation Tabs / Sections for Profile Management -->
    <nav aria-label="Profile navigation" class="profile-nav-tabs">
      <a class="nav-tab-btn" href="#tab-general" data-tab="tab-general" id="tab-btn-general">General</a>
      <a class="nav-tab-btn" href="#tab-security" data-tab="tab-security" id="tab-btn-security">Password</a>
      <a class="nav-tab-btn" href="#tab-oauth" data-tab="tab-oauth" id="tab-btn-oauth">Connected Accounts</a>
      <a class="nav-tab-btn" href="#tab-passkeys" data-tab="tab-passkeys" id="tab-btn-passkeys">Passkeys</a>
    </nav>

    <!-- Tab 1: General Info & Avatar -->
    <section aria-labelledby="tab-btn-general" class="tab-pane" id="tab-general" role="region">
      <div th:replace="~{fragments/profile/profile-info :: profile-info}"></div>
    </section>

    <!-- Tab 2: Password & Credentials -->
    <section aria-labelledby="tab-btn-security" class="tab-pane" id="tab-security" role="region">
      <div th:replace="~{fragments/profile/security-password :: security-password}"></div>
    </section>

    <!-- Tab 3: Connected OAuth Methods -->
    <section aria-labelledby="tab-btn-oauth" class="tab-pane" id="tab-oauth" role="region">
      <div th:replace="~{fragments/profile/oauth-methods :: oauth-methods}"></div>
    </section>

    <!-- Tab 4: Passkeys -->
    <section aria-labelledby="tab-btn-passkeys" class="tab-pane" id="tab-passkeys" role="region">
      <div th:replace="~{fragments/profile/passkeys :: passkeys}"></div>
    </section>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script defer src="/js/passkey-register.js" th:src="@{/js/passkey-register.js}"></script>
</body>
</html>
