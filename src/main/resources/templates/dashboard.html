<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('User Profile & Security')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-wrapper profile-page-wrapper">
  <div class="profile-container">
    <!-- Top Profile Summary & Avatar Header Fragment -->
    <div th:replace="~{fragments/profile/profile-header :: profile-header}"></div>

    <!-- Global Alert Notifications Fragment -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <!-- Navigation Tabs / Sections for Profile Management -->
    <div aria-label="Profile navigation" class="profile-nav-tabs" role="tablist">
      <button aria-controls="tab-general" aria-selected="true" class="nav-tab-btn active"
              data-tab="tab-general" id="tab-btn-general" role="tab" tabindex="0" type="button">General</button>
      <button aria-controls="tab-security" aria-selected="false" class="nav-tab-btn"
              data-tab="tab-security" id="tab-btn-security" role="tab" tabindex="-1" type="button">Password</button>
      <button aria-controls="tab-oauth" aria-selected="false" class="nav-tab-btn"
              data-tab="tab-oauth" id="tab-btn-oauth" role="tab" tabindex="-1" type="button">Connected Accounts</button>
      <button aria-controls="tab-passkeys" aria-selected="false" class="nav-tab-btn"
              data-tab="tab-passkeys" id="tab-btn-passkeys" role="tab" tabindex="-1" type="button">Passkeys</button>
    </div>

    <!-- Tab 1: General Info & Avatar -->
    <section aria-labelledby="tab-btn-general" class="tab-pane active" id="tab-general" role="tabpanel" tabindex="0">
      <div th:replace="~{fragments/profile/profile-info :: profile-info}"></div>
    </section>

    <!-- Tab 2: Password & Credentials -->
    <section aria-labelledby="tab-btn-security" class="tab-pane" hidden id="tab-security" role="tabpanel" tabindex="0">
      <div th:replace="~{fragments/profile/security-password :: security-password}"></div>
    </section>

    <!-- Tab 3: Connected OAuth Methods -->
    <section aria-labelledby="tab-btn-oauth" class="tab-pane" hidden id="tab-oauth" role="tabpanel" tabindex="0">
      <div th:replace="~{fragments/profile/oauth-methods :: oauth-methods}"></div>
    </section>

    <!-- Tab 4: Passkeys -->
    <section aria-labelledby="tab-btn-passkeys" class="tab-pane" hidden id="tab-passkeys" role="tabpanel" tabindex="0">
      <div th:replace="~{fragments/profile/passkeys :: passkeys}"></div>
    </section>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script defer src="/js/passkey-register.js" th:src="@{/js/passkey-register.js}"></script>
</body>
</html>
