<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Sign In')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-wrapper">
  <div class="auth-card">
    <header class="auth-header">
      <h1 class="auth-title">Sign In</h1>
      <p class="auth-subtitle">Choose your preferred authentication method</p>
    </header>

    <!-- Dynamic Alerts Fragment -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="columns-container">
      <!-- Left Column: Standard Email & Password Form -->
      <section class="auth-column left-column">
        <h2 class="column-title">Account Login</h2>
        <form class="auth-form" id="loginForm" method="post" th:action="@{/login}">
          <input th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"
                 type="hidden"/>

          <div class="form-group">
            <div class="input-wrapper floating-input-wrapper">
              <span class="input-icon">
                <svg fill="none" height="15" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="15">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </span>
              <input autocomplete="email" autofocus id="username" name="username"
                     placeholder=" " required type="email">
              <label class="floating-label" for="username">Email address</label>
            </div>
          </div>

          <div class="form-group">
            <div class="input-wrapper floating-input-wrapper">
              <span class="input-icon">
                <svg fill="none" height="15" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="15">
                  <rect height="11" rx="2" ry="2" width="18" x="3" y="11"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input autocomplete="current-password" id="password" name="password"
                     placeholder=" " required type="password">
              <label class="floating-label" for="password">Password</label>
              <button aria-label="Toggle password visibility" class="toggle-password-btn"
                      id="togglePasswordBtn" title="Toggle password visibility" type="button">
                <svg class="eye-open" fill="none" height="15" stroke="currentColor" stroke-width="2"
                     viewBox="0 0 24 24" width="15">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-closed hidden" fill="none" height="15" stroke="currentColor"
                     stroke-width="2" viewBox="0 0 24 24" width="15">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" x2="23" y1="1" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-checkbox-row">
            <label class="checkbox-label" for="remember-me">
              <input class="checkbox-input" id="remember-me" name="remember-me" type="checkbox">
              <span class="checkbox-text">Remember me</span>
            </label>
          </div>

          <button class="btn btn-primary" id="loginBtn" type="submit">
            <span class="btn-text">Sign In</span>
            <span class="btn-spinner hidden"></span>
          </button>

          <div class="auth-footer-link">
            <span>Don't have an account?</span>
            <a th:href="@{/register}">Create account</a>
          </div>
        </form>
      </section>

      <!-- Minimal Divider -->
      <div class="column-divider">
        <span class="divider-line"></span>
        <span class="divider-text">OR</span>
        <span class="divider-line"></span>
      </div>

      <!-- Right Column: Fast Sign-In / OAuth & Passkeys Fragment -->
      <div th:replace="~{fragments/social-login :: social-login('Fast Sign-In')}"></div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script defer src="/js/passkey-login.js" th:src="@{/js/passkey-login.js}"></script>
</body>
</html>
