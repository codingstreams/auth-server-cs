<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Sign In')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-wrapper">
  <div class="auth-card">
    <header class="auth-header">
      <h1 class="auth-title">Sign In</h1>
      <p class="auth-subtitle">Choose your preferred authentication method</p>
    </header>

    <!-- Dynamic Alerts Fragment -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="columns-container">
      <!-- Left Column: Standard Email & Password Form -->
      <section class="auth-column left-column">
        <h2 class="column-title">Account Login</h2>
        <form class="auth-form" id="loginForm" method="post" th:action="@{/login}">
          <input th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"
                 type="hidden"/>

          <div th:replace="~{fragments/ui/fields :: floating('username', 'username', 'Email address', 'email', 'email', null, true, null)}"></div>

          <div th:replace="~{fragments/ui/fields :: floating('password', 'password', 'Password', 'password', 'current-password', null, false, null)}"></div>

          <div class="form-checkbox-row">
            <label th:replace="~{fragments/ui/checkboxes :: checkbox('remember-me', 'remember-me', 'Remember me', false, false)}"></label>
          </div>

          <button th:replace="~{fragments/ui/buttons :: submit('Sign In', 'loginBtn')}"></button>

          <div class="auth-footer-link">
            <span>Don't have an account?</span>
            <a th:href="@{/register}">Create account</a>
          </div>
        </form>
      </section>

      <!-- Minimal Divider -->
      <div class="column-divider">
        <span class="divider-line"></span>
        <span class="divider-text">OR</span>
        <span class="divider-line"></span>
      </div>

      <!-- Right Column: Fast Sign-In / OAuth & Passkeys Fragment -->
      <div th:replace="~{fragments/social-login :: social-login('Fast Sign-In')}"></div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script defer src="/js/passkey-login.js" th:src="@{/js/passkey-login.js}"></script>
</body>
</html>
