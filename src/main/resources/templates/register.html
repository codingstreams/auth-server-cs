<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Create Account')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-wrapper">
  <div class="auth-card">
    <header class="auth-header">
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Get started with your free Auth Server account</p>
    </header>

    <!-- Dynamic Alerts Fragment -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="columns-container">
      <!-- Left Column: Standard Registration Form -->
      <section class="auth-column left-column">
        <h2 class="column-title">Account Details</h2>
        <form class="auth-form" id="registerForm" method="post" th:action="@{/register}">
          <!-- Full Name Field -->
          <div th:replace="~{fragments/ui/fields :: floating('regName', 'name', 'Full Name', 'text', 'name', null, true, null)}"></div>

          <!-- Email Field -->
          <div th:replace="~{fragments/ui/fields :: floating('regEmail', 'email', 'Email address', 'email', 'email', null, false, null)}"></div>

          <!-- Password Field -->
          <div th:replace="~{fragments/ui/fields :: floating('regPassword', 'password', 'Password', 'password', 'new-password', 8, false, 'Use at least 8 characters.')}"></div>

          <!-- Confirm Password Field -->
          <div th:replace="~{fragments/ui/fields :: floating('regConfirmPassword', 'confirmPassword', 'Confirm Password', 'password', 'new-password', 8, false, null)}"></div>

          <button th:replace="~{fragments/ui/buttons :: submit('Create Account', 'registerBtn')}"></button>

          <div class="auth-footer-link">
            <span>Already have an account?</span>
            <a th:href="@{/login}">Sign in</a>
          </div>
        </form>
      </section>

      <!-- Minimal Divider -->
      <div class="column-divider">
        <span class="divider-line"></span>
        <span class="divider-text">OR</span>
        <span class="divider-line"></span>
      </div>

      <!-- Right Column: Fast Sign-Up / OAuth & Passkeys Fragment -->
      <div th:replace="~{fragments/social-login :: social-login('Other ways to continue')}"></div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script defer src="/js/passkey-login.js" th:src="@{/js/passkey-login.js}"></script>
</body>
</html>
