<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="alerts-container" th:fragment="alerts">
  <th:block th:if="${param.error != null}"
            th:with="alertMessage=${param.error[0] == 'missing_email' ? 'OAuth provider did not provide an email address.' : param.error[0] == 'invalid_password' ? 'Current password is incorrect.' : param.error[0] == 'password_mismatch' ? 'Passwords do not match.' : param.error[0] == 'user_exists' ? 'An account with this email already exists.' : param.error[0] == 'cannot_unlink' ? 'Cannot unlink OAuth: this is your only login method.' : param.error[0] == 'oauth' ? 'Unable to sign in with the selected OAuth provider.' : 'Invalid credentials or request failed.'}">
    <div th:replace="~{fragments/ui/alerts :: alert('error', ${alertMessage})}"></div>
  </th:block>
  <th:block th:if="${param.registered != null}">
    <div th:replace="~{fragments/ui/alerts :: alert('success', 'Account created successfully! Please sign in.')}"></div>
  </th:block>
  <th:block th:if="${param.logout != null}">
    <div th:replace="~{fragments/ui/alerts :: alert('success', 'You have been signed out.')}"></div>
  </th:block>
  <th:block th:if="${param.updated != null}"
            th:with="alertMessage=${param.updated[0] == 'name' ? 'Profile name updated successfully.' : param.updated[0] == 'password' ? 'Password changed successfully.' : param.updated[0] == 'avatar' ? 'Avatar updated successfully.' : param.updated[0] == 'oauth' ? 'OAuth login method unlinked.' : param.updated[0] == 'passkey_added' ? 'Passkey added successfully.' : param.updated[0] == 'passkey_removed' ? 'Passkey removed.' : 'Settings updated successfully.'}">
    <div th:replace="~{fragments/ui/alerts :: alert('success', ${alertMessage})}"></div>
  </th:block>
</div>
</body>
</html>
