<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="settings-card" th:fragment="security-password">
  <div class="settings-card-header">
    <div class="card-header-icon">
      <svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
           viewBox="0 0 24 24" width="18">
        <rect height="11" rx="2" ry="2" width="18" x="3" y="11"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <div>
      <h2 class="settings-card-title">Password & Credentials</h2>
      <p class="settings-card-desc">Manage your password for direct email sign-in.</p>
    </div>
  </div>

  <!-- Case 1: User has existing password -->
  <form class="settings-form" method="post" th:action="@{/profile/change-password}" th:if="${hasPassword}">
    <input th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/>

    <div class="form-group">
      <label for="currentPassword">Current Password</label>
      <div class="input-wrapper">
        <input autocomplete="current-password" id="currentPassword" name="currentPassword" placeholder="••••••••"
               required type="password">
      </div>
    </div>

    <div class="form-row-2">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="input-wrapper">
          <input autocomplete="new-password" id="newPassword" minlength="8" name="newPassword" placeholder="••••••••"
                 required type="password">
        </div>
      </div>

      <div class="form-group">
        <label for="confirmNewPassword">Confirm New Password</label>
        <div class="input-wrapper">
          <input autocomplete="new-password" id="confirmNewPassword" minlength="8" name="confirmNewPassword"
                 placeholder="••••••••" required type="password">
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-secondary" type="submit">Update Password</button>
    </div>
  </form>

  <!-- Case 2: User registered via OAuth and has NO password yet -->
  <div class="oauth-no-password-notice" th:unless="${hasPassword}">
    <div class="notice-box">
      <svg fill="none" height="18" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" x2="12" y1="8" y2="12"></line>
        <line x1="12" x2="12.01" y1="16" y2="16"></line>
      </svg>
      <div>
        <strong>No Local Password Set</strong>
        <p>You signed in via an external OAuth provider (<span th:text="${provider}">GOOGLE</span>). Set a password to
          enable direct email login and account unlinking.</p>
      </div>
    </div>

    <form class="settings-form mt-3" method="post" th:action="@{/profile/change-password}">
      <input th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/>
      <input name="currentPassword" type="hidden" value=""/>

      <div class="form-row-2">
        <div class="form-group">
          <label for="setNewPassword">Create Password</label>
          <div class="input-wrapper">
            <input autocomplete="new-password" id="setNewPassword" minlength="8" name="newPassword"
                   placeholder="••••••••" required type="password">
          </div>
        </div>

        <div class="form-group">
          <label for="setConfirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <input autocomplete="new-password" id="setConfirmPassword" minlength="8" name="confirmNewPassword"
                   placeholder="••••••••" required type="password">
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Set Password</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
