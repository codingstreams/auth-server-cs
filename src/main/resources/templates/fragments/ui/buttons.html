<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<button class="btn" th:fragment="button(label, variant, type, id, disabled)"
        th:classappend="'btn-' + ${variant}" th:type="${type}" th:id="${id}" th:disabled="${disabled}">
  <span th:text="${label}">Action</span>
</button>
<button class="btn btn-primary" type="submit" th:fragment="submit(label, id)" th:id="${id}">
  <span class="btn-text" th:text="${label}">Submit</span>
  <span aria-hidden="true" class="btn-spinner hidden"></span>
</button>
</body>
</html>
